<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decom Lista - JSON Saver</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
      --danger-color: #f85149;
      --border-color: #30363d;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: var(--accent-color);
      font-size: 24px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }

    .btn-add {
      background-color: var(--accent-color);
      color: #fff;
    }

    .btn-export {
      background-color: #238636;
      color: #fff;
      width: 100%;
      margin-bottom: 10px;
    }

    .btn-import {
      background-color: #8957e5;
      color: #fff;
      width: 100%;
      margin-bottom: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: var(--bg-color);
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
    }

    .item-text {
      flex: 1;
      cursor: pointer;
    }

    .completed {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .btn-delete {
      background-color: var(--danger-color);
      color: #fff;
      padding: 5px 10px;
      font-size: 12px;
    }

    #file-input {
      display: none;
    }

    .actions {
      margin-top: 20px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📋 Decom Lista</h1>

    <div class="input-group">
      <input type="text" id="item-input" placeholder="Novo item..." onkeypress="handleKeyPress(event)">
      <button class="btn-add" onclick="addItem()">Adicionar</button>
    </div>

    <ul id="list-container">
      <!-- Itens aparecerão aqui -->
    </ul>

    <div class="actions">
      <button class="btn-export" onclick="exportJSON()">💾 Salvar em JSON</button>
      <button class="btn-import" onclick="document.getElementById('file-input').click()">📂 Carregar JSON</button>
      <input type="file" id="file-input" accept=".json" onchange="importJSON(event)">
    </div>
  </div>

  <script>
    let listData = [];

    // Renderiza a lista na tela
    function renderList() {
      const listContainer = document.getElementById('list-container');
      listContainer.innerHTML = '';

      listData.forEach((item, index) => {
        const li = document.createElement('li');

        const span = document.createElement('span');
        span.textContent = item.text;
        span.className = `item-text ${item.completed ? 'completed' : ''}`;
        span.onclick = () => toggleComplete(index);

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Excluir';
        deleteBtn.className = 'btn-delete';
        deleteBtn.onclick = () => deleteItem(index);

        li.appendChild(span);
        li.appendChild(deleteBtn);
        listContainer.appendChild(li);
      });
    }

    // Adiciona novo item
    function addItem() {
      const input = document.getElementById('item-input');
      const text = input.value.trim();

      if (text !== '') {
        listData.push({ text: text, completed: false });
        input.value = '';
        renderList();
      }
    }

    // Marca como concluído
    function toggleComplete(index) {
      listData[index].completed = !listData[index].completed;
      renderList();
    }

    // Remove item
    function deleteItem(index) {
      listData.splice(index, 1);
      renderList();
    }

    // Tecla Enter para adicionar
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        addItem();
      }
    }

    // Exporta a lista para arquivo JSON
    function exportJSON() {
      if (listData.length === 0) {
        alert("A lista está vazia!");
        return;
      }
      const dataStr = JSON.stringify(listData, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'minha_lista.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Importa arquivo JSON para a lista
    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const jsonData = JSON.parse(e.target.result);
          if (Array.isArray(jsonData)) {
            listData = jsonData;
            renderList();
            alert("Lista carregada com sucesso!");
          } else {
            alert("Formato de JSON inválido.");
          }
        } catch (error) {
          alert("Erro ao ler o arquivo JSON.");
        }
      };
      reader.readAsText(file);
      // Reseta o input para permitir importar o mesmo arquivo novamente se necessário
      event.target.value = '';
    }

    // Inicializa a tela
    renderList();
  </script>
</body>

</html>
